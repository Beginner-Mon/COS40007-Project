defaults:
  - task: boning_vs_slicing # Default task
  - _self_

seed: 42
device: auto

artifacts_dir: artifacts/shared

data:
  window_size: 60
  stride: 30
  pad_target_len: 60
  batch_size: 32
  sensor_types:
    - "Segment Velocity"
    - "Segment Acceleration"
  video_suffix: null
  num_workers: 0
  val_split: 0.2
  participant: "both" 
  frame_skip_step: 2

model:
  hidden_size: 128
  num_layers: 1
  dropout: 0.4

train:
  epochs: 30
  lr: 1e-4
  grad_clip: 1.0
  weight_decay: 1e-5

loss:
  type: focal
  gamma: 2.0

callbacks:
  early_stopping:
    enabled: true
    monitor: val_loss
    patience: 10
    min_delta: 0.001

  checkpoint:
    enabled: true
    monitor: val_loss

  reduce_lr:
    enabled: true
    monitor: val_loss
    factor: 0.5
    patience: 3
    min_lr: 1e-6

mlflow:
  tracking_uri: "sqlite:///mlflow_tracking.db"

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    name: train_bilstm
