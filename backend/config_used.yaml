seed: 42
device: auto
data:
  window_size: 30
  batch_size: 32
  sensor_type: Segment Velocity
  video_suffix: null
  num_workers: 3
model:
  hidden_size: 128
  num_layers: 2
train:
  epochs: 2
  lr: 0.0001
  grad_clip: 1.0
  weight_decay: 1.0e-05
loss:
  type: auto
callbacks:
  early_stopping:
    enabled: true
    monitor: acc
    patience: 10
    min_delta: 0.001
  checkpoint:
    enabled: true
    monitor: acc
  reduce_lr:
    enabled: true
    monitor: loss
    factor: 0.5
    patience: 5
    min_lr: 1.0e-06
