# =============================================================================
# Apache Airflow Docker Compose — COS40007 ML Pipeline
# =============================================================================
# Simplified single-worker setup using LocalExecutor.
#
# Usage:
#   cd airflow
#   docker compose up airflow-init    (first time only)
#   docker compose up -d
#
# Airflow UI: http://localhost:8080  (admin / admin)
# =============================================================================

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3-python3.11
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: SequentialExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    # Point MLflow inside the container to the mounted tracking DB
    MLFLOW_TRACKING_URI: "sqlite:////opt/airflow/backend/mlflow_tracking.db"
  volumes:
    # Mount DAGs
    - ./dags:/opt/airflow/dags
    # Mount the entire backend so Airflow can run train.py
    - ../backend:/opt/airflow/backend
    # Persist Airflow logs
    - airflow-logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"

services:
  # ------------------------------------------------------------------
  # One-time DB init
  # ------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username $${_AIRFLOW_WWW_USER_USERNAME:-admin} \
          --password $${_AIRFLOW_WWW_USER_PASSWORD:-admin} \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true
    environment:
      <<: *airflow-common-env
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-admin}
    restart: "no"

  # ------------------------------------------------------------------
  # Web server — Airflow UI at http://localhost:8080
  # ------------------------------------------------------------------
  airflow-webserver:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always

  # ------------------------------------------------------------------
  # Scheduler — picks up DAGs and runs tasks
  # ------------------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $${HOSTNAME}"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always

volumes:
  airflow-logs:
